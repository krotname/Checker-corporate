name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: ./mvnw -B -DskipTests clean package
      - name: Resolve release artifact
        run: |
          set -euo pipefail
          release_jar="$(find target -maxdepth 1 -type f -name 'checker-corporate-*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          sources_jar="$(find target -maxdepth 1 -type f -name 'checker-corporate-*-sources.jar' -print -quit)"
          javadoc_jar="$(find target -maxdepth 1 -type f -name 'checker-corporate-*-javadoc.jar' -print -quit)"
          if [ -z "$release_jar" ]; then
            echo "Release JAR was not found" >&2
            exit 1
          fi
          if [ -z "$sources_jar" ]; then
            echo "Sources JAR was not found" >&2
            exit 1
          fi
          if [ -z "$javadoc_jar" ]; then
            echo "Javadoc JAR was not found" >&2
            exit 1
          fi
          {
            echo "RELEASE_JAR=$release_jar"
            echo "SOURCES_JAR=$sources_jar"
            echo "JAVADOC_JAR=$javadoc_jar"
          } >> "$GITHUB_ENV"
      - name: Generate release checksums
        run: |
          sha256sum \
            "$RELEASE_JAR" \
            "$SOURCES_JAR" \
            "$JAVADOC_JAR" \
            target/bom.xml \
            target/bom.json > target/checksums.txt
          cat target/checksums.txt
      - name: Generate artifact provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: target/checksums.txt
      - name: Generate SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ env.RELEASE_JAR }}
          sbom-path: target/bom.json
      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/krotname/company-status-checker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_JAR }}
            ${{ env.SOURCES_JAR }}
            ${{ env.JAVADOC_JAR }}
            target/bom.xml
            target/bom.json
            target/checksums.txt
